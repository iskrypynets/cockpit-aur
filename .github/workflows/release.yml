name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Extract Release Notes
        id: notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          python3 tools/extract_changelog.py "$TAG_NAME" -o release_notes.md
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Frontend
        run: |
          npm ci
          npm run build
          cp src/manifest.json dist/
          cp src/index.html dist/

      - name: Build Backend in Arch Linux Container
        run: |
          docker run --rm -v "${{ github.workspace }}":/workspace -w /workspace archlinux:latest bash -c "
            set -e
            pacman -Syu --noconfirm
            pacman -S --noconfirm git base-devel rust pacman openssl curl pkgconf jq
            cd backend
            cargo build --release --locked
            strip target/release/cockpit-aur-backend
          "

      - name: Package Release Assets
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # 1. Standalone backend binary
          cp backend/target/release/cockpit-aur-backend ./cockpit-aur-backend

          # 2. Complete distribution archive (frontend dist + backend binary + tools)
          ARCHIVE_DIR="cockpit-aur-${VERSION_NUM}"
          mkdir -p "${ARCHIVE_DIR}"
          cp -r dist "${ARCHIVE_DIR}/dist"
          mkdir -p "${ARCHIVE_DIR}/backend"
          cp backend/target/release/cockpit-aur-backend "${ARCHIVE_DIR}/backend/"
          cp -r tools "${ARCHIVE_DIR}/tools"
          cp deploy.sh "${ARCHIVE_DIR}/" 2>/dev/null || true
          cp package.json README.md "${ARCHIVE_DIR}/" 2>/dev/null || true
          tar -cJf "cockpit-aur-${VERSION_NUM}-x86_64.tar.xz" "${ARCHIVE_DIR}"

          # 3. Checksums
          sha256sum cockpit-aur-backend "cockpit-aur-${VERSION_NUM}-x86_64.tar.xz" > sha256sums.txt
          echo "" >> release_notes.md
          echo "### Checksums (SHA-256)" >> release_notes.md
          echo '```' >> release_notes.md
          cat sha256sums.txt >> release_notes.md
          echo '```' >> release_notes.md

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag_name }}" \
            --title "cockpit-aur ${{ steps.notes.outputs.tag_name }}" \
            --notes-file release_notes.md \
            cockpit-aur-backend \
            cockpit-aur-*-x86_64.tar.xz \
            sha256sums.txt

      - name: Publish to Gitea Releases
        if: env.GITEA_TOKEN != ''
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL || 'https://git.gfnet.cloudns.be' }}
          GITEA_REPO: ${{ vars.GITEA_REPO || 'gf/cockpit-aur' }}
        run: |
          python3 tools/publish_gitea_release.py \
            --tag "${{ steps.notes.outputs.tag_name }}" \
            --title "cockpit-aur ${{ steps.notes.outputs.tag_name }}" \
            --notes-file release_notes.md \
            --assets cockpit-aur-backend cockpit-aur-*-x86_64.tar.xz sha256sums.txt \
            --url "$GITEA_URL" \
            --repo "$GITEA_REPO" \
            --token "$GITEA_TOKEN"
