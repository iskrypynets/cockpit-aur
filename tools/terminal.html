<!DOCTYPE html>
<html id="system-terminal-page">
<head>
    <title translate="yes">Terminal</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="terminal.css" type="text/css" rel="stylesheet" />
    <script src="../base1/cockpit.js"></script>
    <script src="../base1/po.js"></script>
    <script src="po.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c0e;
        }

        .xterm, .xterm-screen, .xterm-rows, .xterm-accessibility {
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: pan-y !important;
        }

        .xterm-viewport {
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch !important;
        }
        .xterm-viewport::-webkit-scrollbar {
            width: 8px !important;
            background: rgba(0, 0, 0, 0.4) !important;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35) !important;
            border-radius: 4px !important;
        }

        /* ── Terminal Header & Settings Toggle ─────────────────────────────── */
        .terminal-group {
            display: flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
            flex-wrap: wrap !important;
            padding: 6px 12px !important;
            min-height: 38px !important;
            background: #111215 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-sizing: border-box !important;
        }

        .terminal-title {
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #94a3b8 !important;
            margin: 0 !important;
            padding: 2px 0 !important;
        }

        /* By default, hide Cockpit's bulky settings toolbar (Font size, Appearance, Reset) */
        #toolbar, .terminal-group > .pf-v6-c-toolbar {
            display: none !important;
        }

        /* Shown only when user explicitly toggles it via Settings button */
        body.show-settings #toolbar,
        body.show-settings .terminal-group > .pf-v6-c-toolbar {
            display: flex !important;
            width: 100% !important;
            margin-top: 6px !important;
            padding-top: 6px !important;
            border-top: 1px dashed rgba(255, 255, 255, 0.12) !important;
        }

        /* Fixed / Overlay Header Action Bar (Completely isolated from React's DOM tree) */
        #terminal-custom-bar {
            position: fixed;
            top: 5px;
            right: 8px;
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(17, 18, 21, 0.9);
            backdrop-filter: blur(6px);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
        }

        .term-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 26px;
            padding: 0 8px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 500;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .term-action-btn:hover, .term-action-btn:focus-visible {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }
        .term-action-btn:active {
            transform: scale(0.96);
        }
        .term-action-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        /* History select box, shown when settings are expanded */
        .term-history-box {
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #94a3b8;
            padding-right: 4px;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }
        body.show-settings .term-history-box {
            display: inline-flex;
        }
        .term-history-box select {
            background: #1e2025;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
        }
    </style>
</head>
<body class="pf-v6-m-tabular-nums" hidden="true">
    <!-- Standalone custom actions bar: never conflicts with Cockpit React virtual DOM -->
    <div id="terminal-custom-bar">
        <div id="term-history-box" class="term-history-box">
            <span>Scrollback:</span>
            <select id="term-history-select" title="Terminal scrollback history limit">
                <option value="1000">1,000</option>
                <option value="5000">5,000</option>
                <option value="10000">10,000</option>
                <option value="50000">50,000</option>
            </select>
        </div>
        <button id="term-top-btn" class="term-action-btn" type="button" title="Scroll to top of history">↑ Top</button>
        <button id="term-end-btn" class="term-action-btn" type="button" title="Scroll to bottom">↓ End</button>
        <button id="term-copy-btn" class="term-action-btn" type="button" title="Copy terminal output or selection"><span id="term-copy-label">📋 Copy</span></button>
        <button id="term-settings-btn" class="term-action-btn" type="button" title="Show / Hide Settings">⚙️ Settings</button>
    </div>

    <div class="ct-page-fill" id="terminal"></div>
    <script src="terminal.js"></script>
    <script>
    (function() {
        var xtermInstance = null;

        function findXterm() {
            if (xtermInstance) return xtermInstance;
            var root = document.getElementById("terminal");
            if (!root) return null;
            var fiberKey = Object.keys(root).find(function(k) {
                return k.startsWith("__reactFiber$") || k.startsWith("__reactContainer$");
            });
            if (!fiberKey) return null;
            var node = root[fiberKey];
            var depth = 0;
            while (node && depth < 35) {
                if (node.stateNode) {
                    if (node.stateNode.terminal) {
                        xtermInstance = node.stateNode.terminal;
                        return xtermInstance;
                    }
                    if (node.stateNode.terminal_state && node.stateNode.terminal_state.terminal) {
                        xtermInstance = node.stateNode.terminal_state.terminal;
                        return xtermInstance;
                    }
                }
                node = node.child || (node.memoizedState && node.memoizedState.element);
                depth++;
            }
            return null;
        }

        function scrollToTop() {
            var term = findXterm();
            if (term && typeof term.scrollToTop === "function") {
                term.scrollToTop();
                return;
            }
            var viewport = document.querySelector('.xterm-viewport');
            if (viewport) viewport.scrollTop = 0;
        }

        function scrollToBottom() {
            var term = findXterm();
            if (term && typeof term.scrollToBottom === "function") {
                term.scrollToBottom();
                return;
            }
            var viewport = document.querySelector('.xterm-viewport');
            if (viewport) viewport.scrollTop = viewport.scrollHeight;
        }

        function getTerminalOutput() {
            var term = findXterm();
            if (term) {
                if (typeof term.hasSelection === "function" && term.hasSelection()) {
                    var sel = term.getSelection();
                    if (sel && sel.length > 0) return sel;
                }
                if (term.buffer && term.buffer.active) {
                    var buf = term.buffer.active;
                    var lines = [];
                    for (var i = 0; i < buf.length; i++) {
                        var line = buf.getLine(i);
                        if (line) lines.push(line.translateToString(true));
                    }
                    while (lines.length > 0 && lines[lines.length - 1].trim() === "") {
                        lines.pop();
                    }
                    return lines.join("\n");
                }
            }
            var sel = window.getSelection();
            if (sel && sel.toString().trim().length > 0) return sel.toString();
            var rows = document.querySelector(".xterm-rows");
            return rows ? rows.innerText : "";
        }

        function copyOutput(btn, labelSpan) {
            var text = getTerminalOutput();
            if (!text || !text.trim()) {
                if (labelSpan) {
                    labelSpan.textContent = "Empty";
                    setTimeout(function() { labelSpan.textContent = "📋 Copy"; }, 1500);
                }
                return;
            }

            var p = (navigator.clipboard && window.isSecureContext)
                ? navigator.clipboard.writeText(text)
                : new Promise(function(resolve, reject) {
                    var ta = document.createElement("textarea");
                    ta.value = text;
                    ta.style.position = "fixed";
                    ta.style.left = "-9999px";
                    ta.style.top = "-9999px";
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    var ok = false;
                    try { ok = document.execCommand("copy"); } catch (e) {}
                    document.body.removeChild(ta);
                    ok ? resolve() : reject();
                });

            p.then(function() {
                if (labelSpan) {
                    labelSpan.textContent = "✅ Copied!";
                    btn.classList.add("active");
                    setTimeout(function() {
                        labelSpan.textContent = "📋 Copy";
                        btn.classList.remove("active");
                    }, 2000);
                }
            }).catch(function() {
                if (labelSpan) {
                    labelSpan.textContent = "Failed";
                    setTimeout(function() { labelSpan.textContent = "📋 Copy"; }, 1500);
                }
            });
        }

        function applyScrollback(limit) {
            var term = findXterm();
            if (term && term.options) {
                term.options.scrollback = limit;
            }
        }

        function setupTouchScroll() {
            var vp = document.querySelector(".xterm-viewport");
            if (!vp) return;
            var startY = 0;
            vp.addEventListener("touchstart", function(e) {
                if (e.touches.length === 1) startY = e.touches[0].clientY;
            }, { passive: true });
            vp.addEventListener("touchmove", function(e) {
                if (e.touches.length === 1) {
                    var diff = startY - e.touches[0].clientY;
                    startY = e.touches[0].clientY;
                    vp.scrollTop += diff;
                }
            }, { passive: true });
        }

        function init() {
            var topBtn = document.getElementById("term-top-btn");
            var endBtn = document.getElementById("term-end-btn");
            var copyBtn = document.getElementById("term-copy-btn");
            var copyLabel = document.getElementById("term-copy-label");
            var settingsBtn = document.getElementById("term-settings-btn");
            var historySelect = document.getElementById("term-history-select");

            var savedLimit = parseInt(localStorage.getItem("cockpit_terminal_scrollback") || "5000", 10);
            if (historySelect) {
                historySelect.value = String(savedLimit);
                historySelect.addEventListener("change", function() {
                    var val = parseInt(historySelect.value, 10);
                    localStorage.setItem("cockpit_terminal_scrollback", String(val));
                    applyScrollback(val);
                });
            }

            if (topBtn) {
                topBtn.addEventListener("click", function(e) {
                    e.preventDefault();
                    scrollToTop();
                });
            }

            if (endBtn) {
                endBtn.addEventListener("click", function(e) {
                    e.preventDefault();
                    scrollToBottom();
                });
            }

            if (copyBtn) {
                copyBtn.addEventListener("click", function(e) {
                    e.preventDefault();
                    copyOutput(copyBtn, copyLabel);
                });
            }

            if (settingsBtn) {
                settingsBtn.addEventListener("click", function(e) {
                    e.preventDefault();
                    var isShown = document.body.classList.toggle("show-settings");
                    settingsBtn.classList.toggle("active", isShown);
                });
            }

            setupTouchScroll();

            // Periodic sync to make sure xterm instance has the user-configured scrollback limit applied
            setInterval(function() {
                var limit = parseInt(localStorage.getItem("cockpit_terminal_scrollback") || "5000", 10);
                applyScrollback(limit);
            }, 2000);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
