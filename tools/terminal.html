<!DOCTYPE html>
<html id="system-terminal-page">
<head>
    <title translate="yes">Terminal</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="terminal.css" type="text/css" rel="stylesheet" />
    <script src="../base1/cockpit.js"></script>
    <script src="../base1/po.js"></script>
    <script src="po.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c0e;
        }

        .xterm, .xterm-screen, .xterm-rows, .xterm-accessibility {
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: pan-y !important;
        }

        .xterm-viewport {
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch !important;
        }
        .xterm-viewport::-webkit-scrollbar {
            width: 10px !important;
            background: rgba(0, 0, 0, 0.4) !important;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35) !important;
            border-radius: 5px !important;
        }

        /* ── Terminal Header & Settings Toggle ─────────────────────────────── */
        .terminal-group {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            flex-wrap: wrap !important;
            padding: 6px 12px !important;
            background: #111215 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-sizing: border-box !important;
        }

        .terminal-title {
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #94a3b8 !important;
        }

        /* By default, hide Cockpit's bulky settings toolbar (Font size, Appearance, Reset) */
        #toolbar, .terminal-group > .pf-v6-c-toolbar {
            display: none !important;
        }

        /* Shown only when user explicitly toggles it via Settings button */
        #toolbar.settings-visible, .terminal-group > .pf-v6-c-toolbar.settings-visible {
            display: flex !important;
            width: 100% !important;
            margin-top: 6px !important;
            padding-top: 6px !important;
            border-top: 1px dashed rgba(255, 255, 255, 0.12) !important;
        }

        .terminal-header-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .term-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 28px;
            padding: 0 10px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 600;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .term-action-btn:hover, .term-action-btn:focus-visible {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }
        .term-action-btn:active {
            transform: scale(0.95);
        }
        .term-action-btn.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.45);
            color: #38bdf8;
        }
    </style>
</head>
<body class="pf-v6-m-tabular-nums" hidden="true">
    <div class="ct-page-fill" id="terminal"></div>
    <script src="terminal.js"></script>
    <script>
    (function() {
        var xtermInstance = null;

        function findXterm() {
            if (xtermInstance) return xtermInstance;
            var root = document.getElementById("terminal");
            if (!root) return null;
            var fiberKey = Object.keys(root).find(function(k) {
                return k.startsWith("__reactFiber$") || k.startsWith("__reactContainer$");
            });
            if (!fiberKey) return null;
            var node = root[fiberKey];
            var depth = 0;
            while (node && depth < 25) {
                if (node.stateNode) {
                    if (node.stateNode.terminal_state && node.stateNode.terminal_state.terminal) {
                        xtermInstance = node.stateNode.terminal_state.terminal;
                        return xtermInstance;
                    }
                    if (node.stateNode.terminal && typeof node.stateNode.terminal.scrollLines === "function") {
                        xtermInstance = node.stateNode.terminal;
                        return xtermInstance;
                    }
                }
                node = node.child || (node.sibling && node.sibling.child);
                depth++;
            }
            return null;
        }

        function ensureScrollback() {
            var term = findXterm();
            if (term && term.options) {
                // Ensure at least 1000 lines of scrollback history
                if (!term.options.scrollback || term.options.scrollback < 1000) {
                    term.options.scrollback = 1000;
                }
                term.options.scrollSensitivity = 2;
            }
        }

        function scrollLines(deltaLines) {
            var term = findXterm();
            if (term && typeof term.scrollLines === "function") {
                term.scrollLines(deltaLines);
                return;
            }
            var viewport = document.querySelector('.xterm-viewport');
            if (viewport) {
                viewport.scrollTop += (deltaLines * 20);
                viewport.dispatchEvent(new Event('scroll'));
            }
            var target = document.querySelector('.xterm-screen') || document.querySelector('.xterm') || document.getElementById('terminal');
            if (target) {
                target.dispatchEvent(new WheelEvent('wheel', {
                    deltaY: deltaLines * 40,
                    deltaMode: 0,
                    bubbles: true,
                    cancelable: true
                }));
            }
        }

        // Native touch swipe scrolling on the terminal viewport
        function setupTouchScroll() {
            var termEl = document.getElementById('terminal');
            if (!termEl) return;

            var touchStartY = 0;
            var touchLastY = 0;
            var accumulated = 0;

            termEl.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    touchStartY = e.touches[0].clientY;
                    touchLastY = touchStartY;
                    accumulated = 0;
                }
            }, { passive: true });

            termEl.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1) {
                    var currentY = e.touches[0].clientY;
                    var deltaY = touchLastY - currentY; // dragged up = scroll down; dragged down = scroll up
                    touchLastY = currentY;
                    accumulated += deltaY;

                    if (Math.abs(accumulated) >= 14) {
                        var lines = Math.trunc(accumulated / 14);
                        scrollLines(lines);
                        accumulated -= (lines * 14);
                    }
                }
            }, { passive: true });
        }

        function getTerminalOutput() {
            var sel = window.getSelection ? window.getSelection().toString() : "";
            if (sel && sel.trim().length > 0) return sel;

            var a11y = document.querySelectorAll('.xterm-accessibility [role="listitem"]');
            if (a11y && a11y.length > 0) {
                var lines = [];
                for (var i = 0; i < a11y.length; i++) lines.push(a11y[i].textContent || "");
                while (lines.length > 0 && !lines[lines.length - 1].trim()) lines.pop();
                if (lines.length > 0) return lines.join("\n");
            }

            var rows = document.querySelectorAll('.xterm-rows > div');
            if (rows && rows.length > 0) {
                var lines = [];
                for (var i = 0; i < rows.length; i++) lines.push(rows[i].textContent || "");
                while (lines.length > 0 && !lines[lines.length - 1].trim()) lines.pop();
                if (lines.length > 0) return lines.join("\n");
            }

            var container = document.getElementById("terminal");
            return container ? container.innerText || "" : "";
        }

        function copyOutput(btn, labelSpan) {
            var text = getTerminalOutput();
            if (!text || !text.trim()) {
                if (labelSpan) {
                    labelSpan.textContent = "Empty";
                    setTimeout(function() { labelSpan.textContent = "Copy"; }, 1500);
                }
                return;
            }

            var p = navigator.clipboard && navigator.clipboard.writeText
                ? navigator.clipboard.writeText(text)
                : new Promise(function(resolve, reject) {
                    var ta = document.createElement("textarea");
                    ta.value = text;
                    ta.style.position = "fixed";
                    ta.style.left = "-9999px";
                    document.body.appendChild(ta);
                    ta.select();
                    var ok = false;
                    try { ok = document.execCommand("copy"); } catch (e) {}
                    document.body.removeChild(ta);
                    ok ? resolve() : reject();
                });

            p.then(function() {
                if (labelSpan) {
                    labelSpan.textContent = "Copied!";
                    btn.style.borderColor = "#38bdf8";
                    setTimeout(function() {
                        labelSpan.textContent = "Copy";
                        btn.style.borderColor = "rgba(255, 255, 255, 0.15)";
                    }, 2000);
                }
            }).catch(function() {
                if (labelSpan) {
                    labelSpan.textContent = "Failed";
                    setTimeout(function() { labelSpan.textContent = "Copy"; }, 1500);
                }
            });
        }

        // Inject action buttons into Cockpit's .terminal-group header
        function setupHeaderActions() {
            var group = document.querySelector(".terminal-group");
            if (!group) return false;

            if (document.getElementById("terminal-custom-actions")) return true;

            var actionsContainer = document.createElement("div");
            actionsContainer.id = "terminal-custom-actions";
            actionsContainer.className = "terminal-header-actions";

            // 1. Copy button
            var copyBtn = document.createElement("button");
            copyBtn.className = "term-action-btn";
            copyBtn.type = "button";
            copyBtn.title = "Copy terminal output";
            copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span id="header-copy-label" style="pointer-events: none;">Copy</span>';
            var copyLabel = copyBtn.querySelector("#header-copy-label");
            copyBtn.addEventListener("click", function(e) {
                e.preventDefault();
                copyOutput(copyBtn, copyLabel);
            });

            // 2. Settings toggle button (Font size, Appearance)
            var settingsBtn = document.createElement("button");
            settingsBtn.className = "term-action-btn";
            settingsBtn.type = "button";
            settingsBtn.title = "Show / Hide Font size & Appearance settings";
            settingsBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span style="pointer-events: none;">Settings</span>';

            settingsBtn.addEventListener("click", function(e) {
                e.preventDefault();
                var toolbar = document.getElementById("toolbar") || document.querySelector(".terminal-group > .pf-v6-c-toolbar");
                if (toolbar) {
                    var isVisible = toolbar.classList.toggle("settings-visible");
                    settingsBtn.classList.toggle("active", isVisible);
                }
            });

            actionsContainer.appendChild(copyBtn);
            actionsContainer.appendChild(settingsBtn);

            var titleEl = group.querySelector(".terminal-title");
            if (titleEl && titleEl.nextSibling) {
                group.insertBefore(actionsContainer, titleEl.nextSibling);
            } else {
                group.appendChild(actionsContainer);
            }

            return true;
        }

        function init() {
            setupTouchScroll();

            // Continuously ensure header actions and scrollback once React mounts
            var interval = setInterval(function() {
                var done = setupHeaderActions();
                ensureScrollback();
                if (done) clearInterval(interval);
            }, 300);

            // Re-check periodically
            setInterval(ensureScrollback, 2000);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
