<!DOCTYPE html>
<html id="system-terminal-page">
<head>
    <title translate="yes">Terminal</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="terminal.css" type="text/css" rel="stylesheet" />
    <script src="../base1/cockpit.js"></script>
    <script src="../base1/po.js"></script>
    <script src="po.js"></script>
    <style>
        .xterm, .xterm-screen, .xterm-rows, .xterm-accessibility {
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: pan-y !important;
        }

        .xterm-viewport {
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch !important;
        }
        .xterm-viewport::-webkit-scrollbar {
            width: 12px !important;
            background: rgba(0, 0, 0, 0.5) !important;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4) !important;
            border-radius: 6px !important;
            border: 2px solid rgba(0, 0, 0, 0.2) !important;
        }

        /* Floating Terminal Controls Toolbar */
        #terminal-toolbar {
            position: fixed;
            top: 10px;
            right: 12px;
            z-index: 99999;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: rgba(25, 25, 28, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .term-tool-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            min-width: 32px;
            padding: 0 8px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.12s ease;
            touch-action: manipulation;
        }
        .term-tool-btn:hover, .term-tool-btn:focus-visible {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
        }
        .term-tool-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        #copy-terminal-btn {
            gap: 5px;
            padding: 0 10px;
        }
    </style>
</head>
<body class="pf-v6-m-tabular-nums" hidden="true">
    <div id="terminal-toolbar">
        <button id="term-top-btn" class="term-tool-btn" type="button" title="Scroll to top (history)" aria-label="Scroll to top">⤒</button>
        <button id="term-up-btn" class="term-tool-btn" type="button" title="Scroll up" aria-label="Scroll up">▲</button>
        <button id="term-down-btn" class="term-tool-btn" type="button" title="Scroll down" aria-label="Scroll down">▼</button>
        <button id="term-end-btn" class="term-tool-btn" type="button" title="Scroll to bottom" aria-label="Scroll to bottom">⤓</button>
        <button id="copy-terminal-btn" class="term-tool-btn" type="button" title="Copy terminal output" aria-label="Copy terminal output">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-terminal-text" style="pointer-events: none;">Copy</span>
        </button>
    </div>

    <div class="ct-page-fill" id="terminal"></div>
    <script src="terminal.js"></script>
    <script>
    (function() {
        function scrollTerminalByLines(lines) {
            var viewport = document.querySelector('.xterm-viewport');
            if (viewport) {
                // Approximate row height ~ 18-20px
                viewport.scrollTop += (lines * 20);
                viewport.dispatchEvent(new Event('scroll'));
            }
            // Also dispatch WheelEvent on screen so xterm internal buffer state updates
            var target = document.querySelector('.xterm-screen') || document.querySelector('.xterm') || document.getElementById('terminal');
            if (target) {
                var wheelEvt = new WheelEvent('wheel', {
                    deltaY: lines * 40,
                    deltaMode: 0,
                    bubbles: true,
                    cancelable: true
                });
                target.dispatchEvent(wheelEvt);
            }
        }

        function scrollToExtreme(toTop) {
            var viewport = document.querySelector('.xterm-viewport');
            if (viewport) {
                viewport.scrollTop = toTop ? 0 : viewport.scrollHeight;
                viewport.dispatchEvent(new Event('scroll'));
            }
            scrollTerminalByLines(toTop ? -500 : 500);
        }

        // Touch swipe scrolling for mobile screens
        function setupTouchScroll() {
            var termEl = document.getElementById('terminal');
            if (!termEl) return;

            var touchStartY = 0;
            var touchLastY = 0;
            var accumulated = 0;
            var isTouchMoving = false;

            termEl.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    touchStartY = e.touches[0].clientY;
                    touchLastY = touchStartY;
                    accumulated = 0;
                    isTouchMoving = false;
                }
            }, { passive: true });

            termEl.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1) {
                    var currentY = e.touches[0].clientY;
                    var deltaY = touchLastY - currentY; // positive = dragged up (scroll down); negative = dragged down (scroll up)
                    touchLastY = currentY;
                    accumulated += deltaY;

                    // Step threshold: ~15px per line
                    if (Math.abs(accumulated) >= 15) {
                        var lines = Math.trunc(accumulated / 15);
                        scrollTerminalByLines(lines);
                        accumulated -= (lines * 15);
                        isTouchMoving = true;
                    }
                }
            }, { passive: true });
        }

        function getTerminalOutput() {
            // 1. If text is selected by user, use selection
            var sel = window.getSelection ? window.getSelection().toString() : "";
            if (sel && sel.trim().length > 0) return sel;

            // 2. Extract from xterm-accessibility
            var a11yItems = document.querySelectorAll('.xterm-accessibility [role="listitem"]');
            if (a11yItems && a11yItems.length > 0) {
                var lines = [];
                for (var i = 0; i < a11yItems.length; i++) {
                    lines.push(a11yItems[i].textContent || "");
                }
                while (lines.length > 0 && !lines[lines.length - 1].trim()) {
                    lines.pop();
                }
                if (lines.length > 0) return lines.join("\n");
            }

            // 3. Extract from .xterm-rows > div
            var rows = document.querySelectorAll('.xterm-rows > div');
            if (rows && rows.length > 0) {
                var lines = [];
                for (var i = 0; i < rows.length; i++) {
                    lines.push(rows[i].textContent || "");
                }
                while (lines.length > 0 && !lines[lines.length - 1].trim()) {
                    lines.pop();
                }
                if (lines.length > 0) return lines.join("\n");
            }

            var container = document.getElementById("terminal");
            return container ? container.innerText || "" : "";
        }

        function copyText(text) {
            if (!text) return Promise.resolve(false);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text).then(function() {
                    return true;
                }).catch(function() {
                    return execCopy(text);
                });
            }
            return Promise.resolve(execCopy(text));
        }

        function execCopy(text) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try {
                ok = document.execCommand("copy");
            } catch (e) {}
            document.body.removeChild(ta);
            return ok;
        }

        window.addEventListener("DOMContentLoaded", function() {
            setupTouchScroll();

            // Navigation buttons
            var topBtn = document.getElementById("term-top-btn");
            var upBtn = document.getElementById("term-up-btn");
            var downBtn = document.getElementById("term-down-btn");
            var endBtn = document.getElementById("term-end-btn");

            if (topBtn) topBtn.addEventListener("click", function(e) { e.preventDefault(); scrollToExtreme(true); });
            if (endBtn) endBtn.addEventListener("click", function(e) { e.preventDefault(); scrollToExtreme(false); });
            if (upBtn) upBtn.addEventListener("click", function(e) { e.preventDefault(); scrollTerminalByLines(-8); });
            if (downBtn) downBtn.addEventListener("click", function(e) { e.preventDefault(); scrollTerminalByLines(8); });

            // Copy button
            var btn = document.getElementById("copy-terminal-btn");
            var txt = document.getElementById("copy-terminal-text");
            if (!btn) return;

            btn.addEventListener("click", function(e) {
                e.preventDefault();
                e.stopPropagation();
                var content = getTerminalOutput();
                if (!content || !content.trim()) {
                    txt.textContent = "Empty";
                    setTimeout(function() { txt.textContent = "Copy"; }, 1500);
                    return;
                }
                copyText(content).then(function(ok) {
                    if (ok) {
                        txt.textContent = "Copied!";
                        btn.style.borderColor = "#3e8635";
                        setTimeout(function() {
                            txt.textContent = "Copy";
                            btn.style.borderColor = "rgba(255, 255, 255, 0.12)";
                        }, 2000);
                    } else {
                        txt.textContent = "Failed";
                        setTimeout(function() { txt.textContent = "Copy"; }, 1500);
                    }
                });
            });
        });
    })();
    </script>
</body>
</html>
