<!DOCTYPE html>
<html id="system-overview-page">
<head>
  <meta charset="utf-8" />
  <title>Overview</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="overview.css?v=colorized-v3" />
  <link href="../../static/branding.css?v=colorized-v3" rel="stylesheet" />
  <script type="text/javascript" src="../base1/cockpit.js"></script>
  <script type="text/javascript" src="../base1/po.js"></script>
  <script type="text/javascript" src="overview.js?v=colorized-v3"></script>
  <script type="text/javascript" src="po.js"></script>
  <script src="../manifests.js"></script>
  <style>
    #motd {
      background: #0a0e17 !important;
      color: #f8fafc !important;
      padding: 16px 20px !important;
      border-radius: 8px !important;
      border: 1px solid #1e293b !important;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5) !important;
      font-family: var(--pf-t--global--font--family--monospace, monospace) !important;
      font-size: 13px !important;
      line-height: 1.3 !important;
      overflow-x: auto !important;
    }
    #motd span {
      display: inline !important;
    }
  </style>
  <script>
    (function() {
      const ansiColors = {
        "30": "#64748b", "31": "#f87171", "32": "#4ade80", "33": "#fbbf24",
        "34": "#60a5fa", "35": "#e879f9", "36": "#38bdf8", "37": "#f1f5f9",
        "90": "#94a3b8", "91": "#fca5a5", "92": "#86efac", "93": "#fde047",
        "94": "#93c5fd", "95": "#f0abfc", "96": "#67e8f9", "97": "#ffffff"
      };

      function ansiToHtml(str) {
        if (!str) return "";
        const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let s = str.replace(/(?:\x1b|\u001b|\\e)\[[0-9;]*[HfABCDJKsu]/g, "").trimEnd();
        let fg = null, bold = false, open = false, out = "", last = 0;
        const re = /(?:\x1b|\u001b|\\e)\[([0-9;]*)m|(?:^|\s)\[((?:01;|00;)?[0-9]{1,2}(?:;[0-9]{1,2})*)m/g;
        let m;
        while ((m = re.exec(s)) !== null) {
          const chunk = s.slice(last, m.index);
          if (chunk) {
            let t = esc(chunk);
            if (!fg) {
              t = t.replace(/\b(running|active|Synchronised|0 failed)\b/g, '<span style="color:#4ade80!important;font-weight:bold!important">$1</span>');
              t = t.replace(/\b(degraded|failed|NOT Synchronised)\b/g, '<span style="color:#f87171!important;font-weight:bold!important">$1</span>');
            }
            out += t;
          }
          last = re.lastIndex;
          const cs = m[1] !== undefined ? m[1] : m[2];
          const codes = cs ? cs.split(";").map(Number) : [0];
          for (const code of codes) {
            if (isNaN(code) || code === 0) { fg = null; bold = false; }
            else if (code === 1) { bold = true; }
            else if (code === 22) { bold = false; }
            else if (ansiColors[String(code)]) { fg = ansiColors[String(code)]; }
            else if (code === 39) { fg = null; }
          }
          if (open) { out += "</span>"; open = false; }
          const st = [];
          if (fg) st.push("color:" + fg + "!important");
          if (bold) st.push("font-weight:bold!important");
          if (st.length > 0) { out += '<span style="' + st.join(";") + '">'; open = true; }
        }
        const rem = s.slice(last);
        if (rem) {
          let t = esc(rem);
          if (!fg) {
            t = t.replace(/\b(running|active|Synchronised|0 failed)\b/g, '<span style="color:#4ade80!important;font-weight:bold!important">$1</span>');
            t = t.replace(/\b(degraded|failed|NOT Synchronised)\b/g, '<span style="color:#f87171!important;font-weight:bold!important">$1</span>');
          }
          out += t;
        }
        if (open) out += "</span>";
        return out;
      }

      let cachedMotd = "";
      function applyColorizer() {
        const el = document.getElementById("motd");
        if (!el) return;

        el.style.setProperty("background", "#0a0e17", "important");
        el.style.setProperty("color", "#f8fafc", "important");
        el.style.setProperty("padding", "16px 20px", "important");
        el.style.setProperty("border-radius", "8px", "important");
        el.style.setProperty("border", "1px solid #1e293b", "important");
        el.style.setProperty("box-shadow", "inset 0 2px 4px rgba(0,0,0,0.5)", "important");
        el.style.setProperty("font-family", "monospace", "important");
        el.style.setProperty("font-size", "13px", "important");
        el.style.setProperty("line-height", "1.3", "important");
        el.style.setProperty("overflow-x", "auto", "important");

        if (el.dataset.colorized === "true" && el.querySelector("span[style*='color']")) {
          return;
        }

        let source = cachedMotd || el.textContent || "";
        if (source) {
          const html = ansiToHtml(source);
          if (html) {
            el.innerHTML = html;
            el.dataset.colorized = "true";
          }
        }
      }

      function initCockpitWatch() {
        if (window.cockpit && window.cockpit.file) {
          try {
            window.cockpit.file("/etc/motd").watch(function(content) {
              if (content) {
                cachedMotd = content;
                const el = document.getElementById("motd");
                if (el) {
                  el.dataset.colorized = "false";
                  applyColorizer();
                }
              }
            });
          } catch (e) {
            console.warn("Cockpit file watch error:", e);
          }
        } else {
          setTimeout(initCockpitWatch, 200);
        }
      }
      initCockpitWatch();

      const observer = new MutationObserver(applyColorizer);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      setInterval(applyColorizer, 500);
      window.addEventListener("DOMContentLoaded", applyColorizer);
      window.addEventListener("load", applyColorizer);
    })();
  </script>
</head>
<body class="pf-v6-m-tabular-nums">
  <div class="ct-page-fill" id="overview"></div>
</body>
</html>
