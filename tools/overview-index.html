<!DOCTYPE html>
<html id="system-overview-page">
<head>
  <meta charset="utf-8" />
  <title>Overview</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="overview.css" />
  <link href="../../static/branding.css" rel="stylesheet" />
  <script type="text/javascript" src="../base1/cockpit.js"></script>
  <script type="text/javascript" src="../base1/po.js"></script>
  <script type="text/javascript" src="overview.js"></script>
  <script type="text/javascript" src="po.js"></script>
  <script src="../manifests.js"></script>
  <style>
    #motd {
      font-family: var(--pf-t--global--font--family--monospace, "Liberation Mono", Consolas, Menlo, monospace) !important;
      line-height: 1.25 !important;
      overflow-x: auto;
    }
  </style>
</head>
<body class="pf-v6-m-tabular-nums">
  <div class="ct-page-fill" id="overview"></div>
  <script type="text/javascript">
    (function() {
      const colors = {
        "30": "#4b5563", "31": "#ef4444", "32": "#22c55e", "33": "#eab308",
        "34": "#3b82f6", "35": "#d946ef", "36": "#06b6d4", "37": "#e5e7eb",
        "90": "#9ca3af", "91": "#f87171", "92": "#4ade80", "93": "#fde047",
        "94": "#60a5fa", "95": "#f472b6", "96": "#38bdf8", "97": "#ffffff"
      };

      function escapeHtml(t) {
        return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function ansiToHtml(str) {
        let curFg = null;
        let isBold = false;
        let openSpan = false;
        let out = "";
        let lastIdx = 0;

        const regex = /(?:\x1b|\u001b)\[([0-9;]*)m|(?:\b|^|\s)\[((?:01;|00;)?[0-9]{1,2}(?:;[0-9]{1,2})*)m/g;
        let match;

        while ((match = regex.exec(str)) !== null) {
          const chunk = str.slice(lastIdx, match.index);
          if (chunk) {
            out += escapeHtml(chunk);
          }
          lastIdx = regex.lastIndex;

          const codeStr = match[1] !== undefined ? match[1] : match[2];
          const codes = codeStr ? codeStr.split(";").map(c => parseInt(c, 10)) : [0];

          for (const c of codes) {
            if (isNaN(c) || c === 0) {
              curFg = null;
              isBold = false;
            } else if (c === 1) {
              isBold = true;
            } else if (c === 22) {
              isBold = false;
            } else if (colors[String(c)]) {
              curFg = colors[String(c)];
            } else if (c === 39) {
              curFg = null;
            }
          }

          if (openSpan) {
            out += "</span>";
            openSpan = false;
          }

          const styles = [];
          if (curFg) styles.push("color:" + curFg);
          if (isBold) styles.push("font-weight:bold");

          if (styles.length > 0) {
            out += '<span style="' + styles.join(";") + '">';
            openSpan = true;
          }
        }

        const rem = str.slice(lastIdx);
        if (rem) out += escapeHtml(rem);
        if (openSpan) out += "</span>";

        return out;
      }

      function colorizeMotd() {
        const motd = document.getElementById("motd");
        if (!motd) return;

        const text = motd.textContent || "";
        if (!text.includes("\x1b") && !text.includes("\u001b") && !/\[(?:01;|00;)?[0-9]{1,2}(?:;[0-9]{1,2})*m/.test(text)) {
          return;
        }

        motd.innerHTML = ansiToHtml(text);
      }

      const observer = new MutationObserver(function() {
        colorizeMotd();
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function() {
          colorizeMotd();
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      } else {
        colorizeMotd();
        observer.observe(document.body, { childList: true, subtree: true, characterData: true });
      }
    })();
  </script>
</body>
</html>
